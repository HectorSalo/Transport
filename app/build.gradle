plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.skysam.hchirinos.transport'
    compileSdk 36

    defaultConfig {
        applicationId "com.skysam.hchirinos.transport"
        minSdk 29
        targetSdk 36
        versionCode 19
        versionName "12.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            buildConfigField "String","ENVIRONMENT",'"PRODUCCION"'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField "String","ENVIRONMENT",'"DEMO"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    packaging {
        resources {
            excludes += [
                    "META-INF/INDEX.LIST",
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE*",
                    "META-INF/NOTICE*",
                    "META-INF/*.kotlin_module",
                    "META-INF/*.version",
                    "META-INF/{AL2.0,LGPL2.1}"
            ]
        }
    }
}

def grpcVersion = "1.62.2"

configurations.configureEach {
    resolutionStrategy {
        force "io.grpc:grpc-api:$grpcVersion"
        force "io.grpc:grpc-core:$grpcVersion"
        force "io.grpc:grpc-android:$grpcVersion"
        force "io.grpc:grpc-okhttp:$grpcVersion"
        force "io.grpc:grpc-protobuf-lite:$grpcVersion"
        force "io.grpc:grpc-stub:$grpcVersion"
        force "io.grpc:grpc-context:$grpcVersion"
    }
}


dependencies {
    //Librerias externas
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation ("com.github.bumptech.glide:glide:5.0.5")

    //librerias Firebase
    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.42.1'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}